<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E20E8">
<link rel="icon" href="fvbcv-logo.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Evaluación">
<title>Evaluación Árbitros FVBCV</title>
<!--PWA_HEAD-->
<style>
:root{
  --blue:#1E20E8; --blue-d:#1515C8; --blue-l:#EEEEFF;
  --ok:#17844a; --ok-l:#e3f4ea; --ko:#c62f2f; --ko-l:#fbe7e7;
  --ink:#16202c; --mute:#5d6b7a; --line:#dde3ea; --bg:#f3f5f8; --card:#fff;
  --orange:#F08500; --gold:#FFD000;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;padding:calc(10px + var(--safe-t)) 14px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
header.top h1{font-size:17px;margin:0;font-weight:650;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:12px;opacity:.85;font-weight:400;display:block}
.iconbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;min-width:40px;height:40px;display:grid;place-items:center;font-size:20px;padding:0 10px}
main{flex:1;padding:14px 14px calc(110px + var(--safe-b))}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,32,44,.06);border:1px solid var(--line)}
.card h2{font-size:15px;margin:0 0 10px;color:var(--blue-d);text-transform:uppercase;letter-spacing:.03em}
label.f{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px;font-weight:600}
input.t,textarea.t,select.t{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;font-size:16px}
input.t:focus,textarea.t:focus,select.t:focus{outline:none;border-color:var(--blue)}
textarea.t{resize:vertical;min-height:84px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.roles button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 6px;font-weight:650;font-size:14px;line-height:1.2}
.roles button small{display:block;font-weight:400;color:var(--mute);font-size:11px;margin-top:3px}
.roles button.on{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d)}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:650;font-size:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--blue);color:#fff}
.btn.pri:active{background:var(--blue-d)}
.btn.sec{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--blue);padding:8px}
.btn[disabled]{opacity:.5}
.stack>*+*{margin-top:8px}
/* items */
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 10px}
.sec-head .meta{font-size:13px;color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:999px;padding:5px 10px;white-space:nowrap}
.pill.ok{background:var(--ok-l);color:var(--ok)}
.pill.ko{background:var(--ko-l);color:var(--ko)}
.pill.na{background:#eceff3;color:var(--mute)}
.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.item.apto{border-left:5px solid var(--ok)}
.item.no{border-left:5px solid var(--ko)}
.item .lbl{font-weight:650;font-size:15px;margin-bottom:10px}
.choice{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.choice button{border:1.5px solid var(--line);background:#fff;border-radius:11px;height:46px;font-weight:700;font-size:15px}
.choice .a.on{background:var(--ok);border-color:var(--ok);color:#fff}
.choice .n.on{background:var(--ko);border-color:var(--ko);color:#fff}
.choice .o{width:52px;font-size:19px;color:var(--mute)}
.choice .o.has{color:var(--blue);border-color:var(--blue);background:var(--blue-l)}
.item textarea{margin-top:10px;min-height:60px}
.obsprev{margin-top:8px;font-size:13px;color:var(--mute);font-style:italic}
.bulk{display:flex;gap:8px;margin-bottom:12px}
.bulk button{flex:1;border:1.5px dashed var(--line);background:transparent;border-radius:10px;padding:9px;font-size:13px;font-weight:600;color:var(--mute)}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b))}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{border:0;background:transparent;border-radius:10px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button .ic{font-size:17px;line-height:1;height:20px;display:grid;place-items:center}
nav.tabs button .cnt{font-size:11px;font-weight:800;border-radius:6px;padding:1px 5px;background:#eceff3}
nav.tabs button .cnt.ok{background:var(--ok-l);color:var(--ok)}
nav.tabs button .cnt.ko{background:var(--ko-l);color:var(--ko)}
nav.tabs button.on{background:var(--blue-l);color:var(--blue-d)}
/* home list */
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist .main{flex:1;min-width:0}
.hist .nm{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist .ds{font-size:13px;color:var(--mute)}
.hist .act{display:flex;gap:6px}
.hist .act button{border:1px solid var(--line);background:#fff;border-radius:9px;height:36px;min-width:36px;padding:0 9px;font-size:13px;font-weight:600}
.empty{color:var(--mute);font-size:14px;text-align:center;padding:14px 0}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:1px}
.tag.d{background:#fff3df;color:#9a5a00}
.summary .r{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.summary .r:first-child{border-top:0}
.big{font-size:20px;font-weight:800}
.hint{font-size:13px;color:var(--mute);margin-top:6px}
.prev{background:#eaf2fb;border:1px solid #c7dbf2;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:8px;color:#16304f}
.prev ul{margin:6px 0 0;padding-left:18px}.prev li{margin:2px 0}
.big-com{border:2px solid var(--blue)}
.big-com h2{font-size:18px}
.big-com textarea{min-height:260px;font-size:16px;line-height:1.45}
.warn{background:#fff3df;color:#7a4a00;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}
/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(16px + var(--safe-b))}
.modal h3{margin:0 0 6px;font-size:18px}
.modal p{margin:0 0 14px;color:var(--mute)}
.toast{position:fixed;left:50%;top:calc(70px + var(--safe-t));transform:translateX(-50%);background:#16202c;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90vw;text-align:center}
.hidden{display:none!important}
.brand{display:flex;align-items:center;gap:12px;margin:2px 2px 16px}
.brand img{width:48px;height:48px;object-fit:contain;flex:none}
.brand b{display:block;font-size:17px;color:var(--blue)}
.brand span{font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="modal"></div>

/* ---------- Acceso ---------- */
const WORKER_URL='https://eval-arbitros-fvbcv.fvbcv-eval.workers.dev';
function getDeviceId(){let id=localStorage.getItem('_did');if(!id){id=typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);localStorage.setItem('_did',id);}return id;}
function getDeviceInfo(){try{return{ua:navigator.userAgent.slice(0,200),screen:screen.width+'x'+screen.height,lang:navigator.language,tz:Intl.DateTimeFormat().resolvedOptions().timeZone};}catch(e){return{};}}
function logPdfExport(ev){const token=localStorage.getItem('_session');if(!token)return;fetch(WORKER_URL+'/log/pdf',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,aspirant:ev.aspirant,role:ev.role,examiner:ev.examiner,nEval:ev.nEval,fecha:ev.fecha})}).catch(()=>{});}
function renderLogin(err){
  document.getElementById('app').innerHTML=`<header class="top"><img src="fvbcv-logo.png" alt="FVBCV" style="height:36px;width:36px;object-fit:contain;flex:none;background:#fff;border-radius:8px;padding:3px"><h1>Evaluación Árbitros<span class="sub">FVBCV · Acceso privado</span></h1></header>
  <main style="display:grid;place-items:center;min-height:calc(100vh - 64px);padding:14px">
  <div class="card" style="width:100%;max-width:360px">
    <div class="brand" style="display:flex;align-items:center;gap:12px;margin-bottom:18px"><img src="fvbcv-logo.png" alt="FVBCV" style="width:52px;height:52px;object-fit:contain"><div><b style="display:block;font-size:16px;color:var(--blue)">Evaluación Árbitros</b><span style="font-size:12px;color:var(--mute)">Federación de Voleibol de la CV</span></div></div>
    <label class="f" for="lCode">Código de acceso</label>
    <input class="t" id="lCode" placeholder="XXXX-XXXX" autocomplete="off" autocapitalize="characters" inputmode="text"
      style="text-transform:uppercase;letter-spacing:.12em;font-size:22px;text-align:center;padding:14px">
    <div id="lErr" style="color:var(--ko);font-size:13px;margin:8px 0 0;min-height:18px">${err||''}</div>
    <button class="btn pri" id="lBtn" style="margin-top:10px">Entrar</button>
    <div class="hint" style="text-align:center;margin-top:10px">Si no tienes código, contacta con el examinador jefe.</div>
  </div></main>`;
  const inp=document.getElementById('lCode'),btn=document.getElementById('lBtn'),errEl=document.getElementById('lErr');
  inp.oninput=()=>{let v=inp.value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(v.length>4)v=v.slice(0,4)+'-'+v.slice(4,8);inp.value=v;errEl.textContent='';};
  inp.onkeydown=e=>{if(e.key==='Enter')btn.click();};
  btn.onclick=async()=>{
    const code=inp.value.trim();if(!code){errEl.textContent='Introduce el código.';return;}
    btn.disabled=true;btn.textContent='Comprobando…';errEl.textContent='';
    try{
      const r=await fetch(WORKER_URL+'/auth/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,deviceId:getDeviceId(),deviceInfo:getDeviceInfo()})});
      const d=await r.json();
      if(d.ok){localStorage.setItem('_session',d.token);if(d.masterSession)localStorage.setItem('_master','1');else localStorage.removeItem('_master');if(d.label){localStorage.setItem('_session_label',d.label);mem.examiner=d.label;persist();}render();}
      else{errEl.textContent=d.error||'Código incorrecto';btn.disabled=false;btn.textContent='Entrar';}
    }catch(e){errEl.textContent='Error de conexión. Comprueba internet.';btn.disabled=false;btn.textContent='Entrar';}
  };
}
async function initApp(){
  const token=localStorage.getItem('_session');
  if(token){
    const $a=document.getElementById('app');
    $a.innerHTML='<div style="display:grid;place-items:center;min-height:100vh;color:var(--mute);font-size:14px">Verificando acceso…</div>';
    try{
      const ctrl=new AbortController();
      const tid=setTimeout(()=>ctrl.abort(),8000);
      const r=await fetch(WORKER_URL+'/auth/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token}),signal:ctrl.signal});
      clearTimeout(tid);
      const d=await r.json();
      if(d.ok){
        try{localStorage.setItem('_lastVerified',String(Date.now()));}catch{}
        if(d.masterSession)localStorage.setItem('_master','1');else localStorage.removeItem('_master');
        if(d.label){localStorage.setItem('_session_label',d.label);mem.examiner=d.label;persist();}
        render();return;
      }
    }catch(e){
      if(e&&e.name==='AbortError'){
        // M2: only fail-open if last successful verify was within 72 hours
        try{
          const lv=parseInt(localStorage.getItem('_lastVerified')||'0',10);
          if(lv&&(Date.now()-lv)<72*3600*1000){render();return;}
        }catch{}
      }
    }
    localStorage.removeItem('_session');localStorage.removeItem('_master');localStorage.removeItem('_session_label');
  }
  renderLogin();
}
function exitMaster(){
  try{localStorage.removeItem('_session');localStorage.removeItem('_master');}catch{}
  renderLogin();
}
function masterBanner(){
  if(!localStorage.getItem('_master')) return '';
  return `<div style="background:#fef3c7;border-bottom:1px solid #f59e0b;padding:9px 14px;display:flex;align-items:center;gap:10px;font-size:13px;color:#78350f;flex-shrink:0">
    <span style="flex:1"><strong>Modo de prueba</strong> — Sesión de demostración, sin datos reales.</span>
    <button onclick="exitMaster()" style="border:0;background:#92400e;color:#fff;border-radius:7px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0">Salir</button>
  </div>`;
}

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=s=>{if(!s)return'';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function newEval(){
  return {id:uid(),created:Date.now(),updated:Date.now(),status:'draft',examiner:localStorage.getItem('_session_label')||mem.examiner||'',aspirant:'',role:'',partido:'',categoria:'',genero:'',nivel:'',fecha:today(),items:{},comments:'',nEval:'',nEvalAuto:true};
}
function getEval(id){return mem.evals.find(e=>e.id===id)}
const normName=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
function prevEvals(ev){ // otras evaluaciones del mismo aspirante (cualquier rol)
  const n=normName(ev.aspirant); if(!n) return [];
  return mem.evals.filter(e=>e.id!==ev.id&&normName(e.aspirant)===n).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')||a.created-b.created);
}
function suggestN(ev){const p=prevEvals(ev); return p.length? Math.max(p.length,...p.map(e=>+e.nEval||0))+1 : 1;}
function autoN(ev){ if(ev.nEvalAuto!==false) ev.nEval=ev.aspirant.trim()?suggestN(ev):''; }
function knownAspirants(){const m=new Map();mem.evals.forEach(e=>{const n=normName(e.aspirant);if(n&&!m.has(n))m.set(n,e.aspirant.trim());});return [...m.values()].sort((a,b)=>a.localeCompare(b,'es'));}
function save(){ if(!S.cur)return; S.cur.updated=Date.now(); const i=mem.evals.findIndex(e=>e.id===S.cur.id); if(i<0)mem.evals.unshift(S.cur); else mem.evals[i]=S.cur; persist(); }

/* ---------- Cálculo ---------- */
function secStats(ev,sec){
  let ap=0,no=0; sec.items.forEach((_,i)=>{const v=(ev.items[sec.key+'.'+i]||{}).v; if(v==='apto')ap++; else if(v==='no')no++;});
  const total=sec.items.length, pending=total-ap-no;
  const pass=ap>=sec.min, fail=(total-no)<sec.min;
  return {ap,no,total,pending,pass,fail,state: pass?'ok':(fail?'ko':(pending?'na':'ko'))};
}
function globalStats(ev){
  const r=ROLES[ev.role]; if(!r) return null;
  const secs=r.sections.map(s=>secStats(ev,s));
  const passed=secs.filter(s=>s.pass).length, pending=secs.reduce((a,s)=>a+s.pending,0);
  const anyFail=secs.some(s=>s.fail);
  return {secs,passed,n:secs.length,pending,pass:passed===secs.length,state:passed===secs.length?'ok':(anyFail?'ko':'na')};
}

const TABS=[['datos','Datos','✎'],['antes','Antes','①'],['durante','Durante','②'],['despues','Después','③'],['final','Final','✔']];
function renderEval(){
  const ev=S.cur, r=ROLES[ev.role];
  const g=globalStats(ev);
  let body='';
  if(S.tab==='datos'||!r) body=viewDatos(ev);
  else if(S.tab==='final') body=viewFinal(ev,r,g);
  else body=viewSection(ev,r,r.sections.find(s=>s.key===S.tab));
  $app.innerHTML=`
  <header class="top"><button class="iconbtn" id="back" aria-label="Volver">‹</button>
    <h1>${esc(ev.aspirant||'Nueva evaluación')}<span class="sub">${r?r.name:'Elige el rol a evaluar'}${ev.status==='draft'?' · borrador guardado':''}</span></h1></header>
  ${masterBanner()}
  <main id="main">${body}</main>
  <nav class="tabs"><div class="in">${TABS.map(([k,l,ic])=>{
    let badge=`<span class="ic">${ic}</span>`;
    if(r&&['antes','durante','despues'].includes(k)){const st=secStats(ev,r.sections.find(s=>s.key===k));badge=`<span class="ic"><span class="cnt ${st.state==='na'?'':st.state}">${st.ap}/${st.total}</span></span>`;}
    return `<button data-tab="${k}" class="${S.tab===k?'on':''}" ${!r&&k!=='datos'?'disabled style="opacity:.4"':''}>${badge}${l}</button>`}).join('')}</div></nav>`;
  document.getElementById('back').onclick=()=>{save();S.view='home';S.cur=null;render();};
  $app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if(!r&&b.dataset.tab!=='datos')return;S.tab=b.dataset.tab;render();window.scrollTo(0,0)});
  bindEval(ev,r);
}

    <div class="roles">${Object.entries(ROLES).map(([k,r])=>`<button data-role="${k}" class="${ev.role===k?'on':''}">${r.short}<small>${r.sections.reduce((a,s)=>a+s.items.length,0)} ítems</small></button>`).join('')}</div>
  </div>
  <div class="card"><h2>Personas</h2>
    <label class="f" for="f_aspirant">Árbitro aspirante evaluado</label>
    <input class="t" id="f_aspirant" data-f="aspirant" value="${esc(ev.aspirant)}" placeholder="Nombre y apellidos" list="dl_asp" autocomplete="off">
    <datalist id="dl_asp">${knownAspirants().map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
    <div id="prevBox">${prevBoxHtml(ev)}</div>
    <label class="f" for="f_nEval">Nº de evaluación de este aspirante</label>
    ${nEvalSel(ev)}
    <div class="hint" id="nEvalHint">${ev.nEvalAuto!==false&&ev.aspirant.trim()?'Calculado según tu historial. Puedes cambiarlo.':'Sale en el PDF y en el nombre del archivo.'}</div>
    <label class="f">Examinador</label>
    <div style="padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#f8fafc;font-size:16px;font-weight:600;color:var(--ink)">${esc(ev.examiner||localStorage.getItem('_session_label')||'—')}</div>
  </div>
  <div class="card"><h2>Partido</h2>
    <label class="f" for="f_partido">Partido</label>
    <input class="t" id="f_partido" data-f="partido" value="${esc(ev.partido)}" placeholder="Local – Visitante">
    <div class="row2">
      <div><label class="f" for="f_categoria">Categoría</label><input class="t" id="f_categoria" data-f="categoria" value="${esc(ev.categoria)}" placeholder="p. ej. Cadete"></div>
      <div><label class="f" for="f_genero">Género</label>${sel('genero',ev.genero,['Masculino','Femenino'])}</div>
    </div>
    <label class="f" for="f_nivel">Nivel del partido</label>${sel('nivel',ev.nivel,['Alto','Medio','Bajo'])}
    <label class="f" for="f_fecha">Fecha</label>
    <input class="t" type="date" id="f_fecha" data-f="fecha" value="${esc(ev.fecha)}">
  </div>
  <button class="btn pri" data-goto="antes" ${ev.role?'':'disabled'}>Empezar: Antes del partido ›</button>`;
}
function prevBoxHtml(ev){
  const p=prevEvals(ev); if(!p.length) return ev.aspirant.trim()?'<div class="hint">Primera vez que evalúas a esta persona en este móvil.</div>':'';
  return `<div class="prev"><b>Ya tienes ${p.length} evaluaci${p.length>1?'ones':'ón'} de esta persona:</b><ul>${p.map(e=>{const g=globalStats(e);
    return `<li>${e.nEval?esc(ordinal(e.nEval))+' · ':''}${e.role?ROLES[e.role].short:'Sin rol'} · ${esc(fmtDate(e.fecha))}${e.partido?' · '+esc(e.partido):''} · ${e.status==='done'&&g?(g.pass?'<b style="color:var(--ok)">SUPERA</b>':'<b style="color:var(--ko)">NO SUPERA</b>'):'borrador'}</li>`}).join('')}</ul></div>`;
}
function nEvalSel(ev){
  const max=Math.max(8,+ev.nEval||0);
  return `<select class="t" id="f_nEval"><option value="" ${ev.nEval?'':'selected'}>Sin indicar</option>${Array.from({length:max},(_,i)=>i+1).map(n=>`<option value="${n}" ${+ev.nEval===n?'selected':''}>${ordinal(n)} evaluación</option>`).join('')}</select>`;
}
function sel(f,val,opts){
  const extra=val&&!opts.includes(val)?[val]:[]; // valores antiguos escritos a mano
  return `<select class="t" id="f_${f}" data-f="${f}"><option value="" ${val?'':'selected'}>Elegir…</option>${[...opts,...extra].map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
}
const catText=ev=>[ev.categoria,ev.genero].filter(Boolean).join(' ');
function viewSection(ev,r,sec){
  const st=secStats(ev,sec);
  const idx=r.sections.indexOf(sec), next=r.sections[idx+1];
  return `<div class="sec-head"><div><b>${sec.name}</b><div class="meta">${sec.pct} · mínimo ${sec.min} aptos de ${st.total}</div></div>
    <span class="pill ${st.state}">${st.ap}/${st.total} · ${st.pass?'SUPERA':(st.fail?'NO SUPERA':'pendiente')}</span></div>
  <div class="bulk"><button data-bulk="apto">Marcar pendientes como APTO</button><button data-bulk="clear">Limpiar bloque</button></div>
  ${sec.items.map(([lbl],i)=>{
    const k=sec.key+'.'+i, it=ev.items[k]||{}, open=S.open[k];
    return `<div class="item ${it.v||''}" id="it_${k.replace('.','_')}">
      <div class="lbl">${esc(lbl)}</div>
      <div class="choice">
        <button class="a ${it.v==='apto'?'on':''}" data-set="${k}" data-v="apto">APTO</button>
        <button class="n ${it.v==='no'?'on':''}" data-set="${k}" data-v="no">NO APTO</button>
        <button class="o ${it.obs?'has':''}" data-obs="${k}" aria-label="Observación">✎</button>
      </div>
      ${open?`<textarea class="t" data-obstext="${k}" placeholder="Observaciones (opcional)">${esc(it.obs||'')}</textarea>`:(it.obs?`<div class="obsprev">“${esc(it.obs)}”</div>`:'')}
    </div>`}).join('')}
  <button class="btn pri" data-goto="${next?next.key:'final'}">${next?'Siguiente: '+next.name:'Ir al resumen final'} ›</button>`;
}
function viewFinal(ev,r,g){
  const missing=[];
  if(!ev.aspirant.trim())missing.push('nombre del aspirante');
  return `${g.pending?`<div class="warn">Quedan <b>${g.pending}</b> ítems sin marcar. Saldrán en blanco en el PDF.</div>`:''}
  ${missing.length?`<div class="warn">Falta: ${missing.join(', ')} (pestaña Datos).</div>`:''}
  <div class="card summary"><h2>Resumen · ${r.name}</h2>
    ${r.sections.map((s,i)=>{const st=g.secs[i];return `<div class="r"><div><b>${s.name}</b><div class="hint" style="margin:0">${st.ap} aptos · ${st.no} no aptos${st.pending?' · '+st.pending+' sin marcar':''} · mín. ${s.min}</div></div><span class="pill ${st.state}">${st.pass?'SUPERA':(st.fail?'NO SUPERA':'pendiente')}</span></div>`}).join('')}
    <div class="r"><b>Resultado global</b><span class="big" style="color:${g.pass?'var(--ok)':'var(--ko)'}">${g.pass?'SUPERA':'NO SUPERA'}</span></div>
    <div class="hint">Supera si alcanza el mínimo de aptos en los ${g.n} bloques (${g.passed}/${g.n}).</div>
  </div>
  <div class="card big-com"><h2>Valoración final y comentarios generales</h2>
    <div class="hint" style="margin:0 0 8px">Es lo más importante de la evaluación: sale en una sección grande del PDF.</div>
    <textarea class="t" data-f="comments" rows="12" placeholder="Valoración general del partido, puntos fuertes, aspectos a mejorar, recomendación…">${esc(ev.comments)}</textarea>
  </div>
  <div class="stack">
    <button class="btn pri" id="genPdf">${lastPdf&&lastPdf.id===ev.id?'Volver a descargar PDF':'Descargar PDF'+(ev.status==='done'?'':' y finalizar')}</button>
    ${lastPdf&&lastPdf.id===ev.id&&!dlNs?(canShareFile(lastPdf.file)
      ?'<button class="btn sec" id="sharePdf">↗ Compartir PDF (WhatsApp, correo…)</button>'
      :'<div class="hint" style="text-align:center">PDF descargado. Para enviarlo, ábrelo desde Descargas y compártelo.</div>'):''}
    ${ev.status==='done'?'<button class="btn ghost" id="reopen">Volver a editar como borrador</button>':''}
  </div>`;
}
function bindEval(ev,r){
  const m=document.getElementById('main');
  m.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.role;
    if(ev.role&&ev.role!==k&&Object.keys(ev.items).length){confirmSheet('¿Cambiar de rol?','Se borrarán los ítems ya marcados.','Cambiar',()=>{ev.role=k;ev.items={};save();render();});return;}
    ev.role=k;save();render();});
  m.querySelectorAll('[data-f]').forEach(inp=>inp.oninput=inp.onchange=()=>{ev[inp.dataset.f]=inp.value;save();
    if(inp.dataset.f==='aspirant'){const h=$app.querySelector('header h1');h.firstChild.textContent=inp.value||'Nueva evaluación';
      autoN(ev);save();document.getElementById('prevBox').innerHTML=prevBoxHtml(ev);
      const ns=document.getElementById('f_nEval');ns.outerHTML=nEvalSel(ev);bindN(ev);
      document.getElementById('nEvalHint').textContent=ev.nEvalAuto!==false&&ev.aspirant.trim()?'Calculado según tu historial. Puedes cambiarlo.':'Sale en el PDF y en el nombre del archivo.';}});
  bindN(ev);
  m.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.goto;render();window.scrollTo(0,0)});
  m.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.set, it=ev.items[k]||(ev.items[k]={});
    it.v= it.v===b.dataset.v? null : b.dataset.v;
    if(it.v==='no'&&!it.obs) S.open[k]=true;
    save(); const y=window.scrollY; render(); window.scrollTo(0,y);
    if(it.v==='no'&&S.open[k]){const t=document.querySelector(`[data-obstext="${k}"]`); if(t&&!it.obs) t.focus({preventScroll:true});}
  });
  m.querySelectorAll('[data-obs]').forEach(b=>b.onclick=()=>{const k=b.dataset.obs;S.open[k]=!S.open[k];const y=window.scrollY;render();window.scrollTo(0,y);
    if(S.open[k]){const t=document.querySelector(`[data-obstext="${k}"]`);t&&t.focus({preventScroll:true});}});
  m.querySelectorAll('[data-obstext]').forEach(t=>t.oninput=()=>{const k=t.dataset.obstext;(ev.items[k]||(ev.items[k]={})).obs=t.value;save();
    const ob=t.closest('.item').querySelector('.o'); ob.classList.toggle('has',!!t.value.trim());});
  m.querySelectorAll('[data-bulk]').forEach(b=>b.onclick=()=>{
    const sec=r.sections.find(s=>s.key===S.tab);
    sec.items.forEach((_,i)=>{const k=sec.key+'.'+i;const it=ev.items[k]||(ev.items[k]={});
      if(b.dataset.bulk==='apto'){if(!it.v)it.v='apto';} else {it.v=null;}});
    save();render();});
  const gen=document.getElementById('genPdf');
  if(gen) gen.onclick=async()=>{ev.status='done';save();await exportPdf(ev,true);};
  const sh=document.getElementById('sharePdf'); if(sh) sh.onclick=sharePdf;
  const re=document.getElementById('reopen'); if(re) re.onclick=()=>{ev.status='draft';save();render();};
}

function bindN(ev){const ns=document.getElementById('f_nEval');if(ns)ns.onchange=()=>{ev.nEval=ns.value?+ns.value:'';ev.nEvalAuto=false;save();const h=document.getElementById('nEvalHint');if(h)h.textContent='Elegido a mano.';};}
/* ---------- Diálogos ---------- */
function openFeedbackModal(){
  const md=document.getElementById('modal');
  md.innerHTML=`<div class="modal"><div class="sheet">
    <h3>Sugerencias o quejas</h3>
    <p style="font-size:13px;color:var(--dim);margin:0 0 12px">Tu mensaje es anónimo. No se recoge ningún dato personal.</p>
    <div style="display:flex;gap:12px;margin-bottom:12px">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="radio" name="fbtype" value="sugerencia" checked> Sugerencia</label>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="radio" name="fbtype" value="queja"> Queja</label>
    </div>
    <textarea id="fbMsg" placeholder="Escribe tu mensaje…" maxlength="1000" style="width:100%;min-height:100px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:inherit;resize:vertical;box-sizing:border-box"></textarea>
    <div id="fbChars" style="font-size:12px;color:var(--dim);text-align:right;margin-bottom:12px">0 / 1000</div>
    <div id="fbErr" style="color:var(--ko);font-size:13px;margin-bottom:8px;display:none"></div>
    <div class="stack">
      <button class="btn pri" id="fbSend">Enviar</button>
      <button class="btn sec" id="fbCancel">Cancelar</button>
    </div>
  </div></div>`;
  const textarea=md.querySelector('#fbMsg');
  textarea.oninput=()=>md.querySelector('#fbChars').textContent=textarea.value.length+' / 1000';
  md.querySelector('#fbCancel').onclick=()=>md.innerHTML='';
  md.querySelector('.modal').onclick=e=>{if(e.target.classList.contains('modal'))md.innerHTML='';};
  md.querySelector('#fbSend').onclick=async()=>{
    const type=md.querySelector('[name=fbtype]:checked')?.value;
    const message=textarea.value.trim();
    const err=md.querySelector('#fbErr');
    const btn=md.querySelector('#fbSend');
    err.style.display='none';
    if(!message){err.textContent='Escribe un mensaje.';err.style.display='';return;}
    btn.disabled=true;btn.textContent='Enviando…';
    try{
      const r=await fetch(WORKER_URL+'/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,message})});
      if(r.status===429){err.textContent='Demasiados envíos. Espera unos minutos.';err.style.display='';btn.disabled=false;btn.textContent='Enviar';return;}
      if(!r.ok){err.textContent='Error al enviar. Inténtalo de nuevo.';err.style.display='';btn.disabled=false;btn.textContent='Enviar';return;}
      md.innerHTML='';
      toast('Mensaje enviado. ¡Gracias!');
    }catch{err.textContent='Error de conexión.';err.style.display='';btn.disabled=false;btn.textContent='Enviar';}
  };
}

function confirmSheet(t,p,ok,fn){
  const md=document.getElementById('modal');
  md.innerHTML=`<div class="modal"><div class="sheet"><h3>${esc(t)}</h3><p>${esc(p)}</p><div class="stack"><button class="btn pri" id="mOk" style="background:var(--ko)">${esc(ok)}</button><button class="btn sec" id="mNo">Cancelar</button></div></div></div>`;
  md.querySelector('#mOk').onclick=()=>{md.innerHTML='';fn();};
  md.querySelector('#mNo').onclick=()=>md.innerHTML='';
  md.querySelector('.modal').onclick=e=>{if(e.target.classList.contains('modal'))md.innerHTML='';};
}
let toastT;
function toast(msg){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);}t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),3200);}

/* ---------- PDF ---------- */
function b64ToBytes(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
let TPL_BYTES=null;
function clean(s){ // Helvetica WinAnsi: quitar caracteres no representables (emojis, etc.)
  return String(s||'').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...')
    .replace(/[^\x20-\x7E -ÿ€\n]/g,'');
}
function wrap(text,font,size,maxW){
  const out=[];
  clean(text).split(/\n/).forEach(par=>{
    const words=par.split(/\s+/).filter(Boolean); let line='';
    words.forEach(w=>{
      const t=line?line+' '+w:w;
      if(font.widthOfTextAtSize(t,size)<=maxW){line=t;return;}
      if(line)out.push(line);
      while(font.widthOfTextAtSize(w,size)>maxW){let n=w.length;while(n>1&&font.widthOfTextAtSize(w.slice(0,n),size)>maxW)n--;out.push(w.slice(0,n));w=w.slice(n);}
      line=w;
    });
    if(line)out.push(line);
  });
  return out;
}
async function buildPdf(ev){
  const {PDFDocument,StandardFonts,rgb}=PDFLib;
  if(!TPL_BYTES) TPL_BYTES=b64ToBytes(TEMPLATE_B64);
  const src=await PDFDocument.load(TPL_BYTES);
  const doc=await PDFDocument.create();
  const r=ROLES[ev.role], g=globalStats(ev);
  const F=await doc.embedFont(StandardFonts.Helvetica), FB=await doc.embedFont(StandardFonts.HelveticaBold), FI=await doc.embedFont(StandardFonts.HelveticaOblique);
  const INK=rgb(.05,.15,.42), BLUE=rgb(.11,.37,.66), RED=rgb(.86,.15,.15), OK=rgb(.09,.52,.29), KO=rgb(.78,.18,.18),
        GREY=rgb(.35,.38,.42), LINE=rgb(.62,.65,.70), HEAD=rgb(.92,.94,.97), OBSBG=rgb(.965,.972,.985), WHITE=rgb(1,1,1), BLACK=rgb(0,0,0);
  const X0=45, X1=550, W=X1-X0, TOP=126, BOTTOM=792;
  const C_AP=[380,465], C_NO=[465,550]; // columnas APTO / NO APTO
  let pg=null, y=0; const pages=[];
  const Y=v=>PAGE_H-v;
  async function newPage(){
    const [p]=await doc.copyPages(src,[ANNEX_PAGE]); doc.addPage(p);
    p.drawRectangle({x:520,y:PAGE_H-826,width:40,height:22,color:WHITE}); // tapa el nº de página original
    pg=p; pages.push(p); y=TOP;
  }
  const text=(t,x,yy,f,s,col)=>pg.drawText(t,{x,y:Y(yy),size:s,font:f,color:col||INK});
  const rect=(x,yy,w,h,o)=>pg.drawRectangle(Object.assign({x,y:Y(yy+h),width:w,height:h},o));
  const hline=(x0,x1,yy,c,t)=>pg.drawLine({start:{x:x0,y:Y(yy)},end:{x:x1,y:Y(yy)},thickness:t||.6,color:c||LINE});
  const vline=(x,y0,y1,c,t)=>pg.drawLine({start:{x,y:Y(y0)},end:{x,y:Y(y1)},thickness:t||.6,color:c||LINE});
  const fit=(t,f,s,maxW,min)=>{while(f.widthOfTextAtSize(t,s)>maxW&&s>(min||6))s-=.25;return s;};
  const ensure=async h=>{if(y+h>BOTTOM)await newPage();};

  await newPage();
  // Título
  text('PLANTILLA EXAMINADOR '+r.name.toUpperCase(),X0,y+12,FB,13,BLUE); y+=24;

  // Datos de la evaluación (tabla 2 columnas)
  const nEv=ev.nEval?ordinal(ev.nEval)+' evaluación':'-';
  const data=[
    [['ASPIRANTE',ev.aspirant],['EVALUACIÓN Nº',nEv]],
    [['PARTIDO',ev.partido],['FECHA',fmtDate(ev.fecha)]],
    [['CATEGORÍA',catText(ev)],['NIVEL DEL PARTIDO',ev.nivel]],
    [['EXAMINADOR',ev.examiner],['ROL EVALUADO',r.name]]
  ];
  const RH=17, colW=[W*0.62,W*0.38], LW=[78,92];
  data.forEach((row,ri)=>{
    let x=X0;
    row.forEach(([lab,val],ci)=>{
      rect(x,y,LW[ci],RH,{color:HEAD});
      text(lab,x+4,y+11.5,FB,7,GREY);
      const v=clean(val||'-'); const vw=colW[ci]-LW[ci]-8;
      const bold=ci===0&&ri===0;
      const s=fit(v,bold?FB:F,bold?10:9,vw);
      text(v,x+LW[ci]+5,y+12,bold?FB:F,s,INK);
      x+=colW[ci];
    });
    y+=RH;
  });
  rect(X0,y-RH*data.length,W,RH*data.length,{borderColor:LINE,borderWidth:.7});
  for(let i=1;i<data.length;i++)hline(X0,X1,y-RH*i);
  vline(X0+colW[0],y-RH*data.length,y); vline(X0+LW[0],y-RH*data.length,y); vline(X0+colW[0]+LW[1],y-RH*data.length,y);
  y+=16;

  // Bloques
  const IH=16, OBS_S=8.5, OBS_LH=11, OBS_W=X1-X0-16-FB.widthOfTextAtSize('Obs.: ',OBS_S);
  const cross=(cx,cy,c)=>{const h=4;pg.drawLine({start:{x:cx-h,y:Y(cy)-h},end:{x:cx+h,y:Y(cy)+h},thickness:1.6,color:c});pg.drawLine({start:{x:cx-h,y:Y(cy)+h},end:{x:cx+h,y:Y(cy)-h},thickness:1.6,color:c});};
  const secHeader=async(sec,st,cont)=>{
    await ensure(20+IH+IH);
    text(sec.name.toUpperCase()+(cont?' (cont.)':''),X0,y+12,FB,9.5,RED);
    text(`${sec.pct} - MÍNIMO ${sec.min} APTOS`,X0+FB.widthOfTextAtSize(sec.name.toUpperCase()+(cont?' (cont.)':''),9.5)+14,y+12,FB,8.5,RED);
    const res=`${st.ap}/${st.total} APTOS - ${st.pass?'SUPERA':'NO SUPERA'}`, rs=8.5, rw=FB.widthOfTextAtSize(res,rs)+12;
    rect(X1-rw,y+2,rw,14,{color:st.pass?OK:KO}); text(res,X1-rw+6,y+12.2,FB,rs,WHITE);
    y+=20;
    rect(X0,y,W,IH,{color:HEAD,borderColor:LINE,borderWidth:.6});
    text('ÍTEM',X0+5,y+11,FB,7.5,GREY);
    [['APTO',C_AP],['NO APTO',C_NO]].forEach(([t,[a,b]])=>{vline(a,y,y+IH);text(t,(a+b)/2-FB.widthOfTextAtSize(t,7.5)/2,y+11,FB,7.5,GREY);});
    y+=IH;
  };
  for(let si=0;si<r.sections.length;si++){
    const sec=r.sections[si], st=g.secs[si];
    // mantener el bloque entero en una hoja si cabe en una hoja nueva
    const secH=36+sec.items.reduce((a,_,i)=>{const o=clean((ev.items[sec.key+'.'+i]||{}).obs).trim();return a+IH+(o?wrap(o,F,OBS_S,OBS_W).length*OBS_LH+7:0);},0);
    if(y+secH>BOTTOM&&secH<=BOTTOM-TOP) await newPage();
    await secHeader(sec,st,false);
    for(let i=0;i<sec.items.length;i++){
      const lbl=sec.items[i][0], it=ev.items[sec.key+'.'+i]||{};
      const o=clean(it.obs).trim();
      const ol=o?wrap(o,F,OBS_S,OBS_W):[];
      const oh=ol.length?ol.length*OBS_LH+7:0;
      if(y+IH+oh>BOTTOM){await newPage();await secHeader(sec,st,true);}
      const y0=y;
      text(clean(lbl).toUpperCase(),X0+5,y+11,F,fit(clean(lbl).toUpperCase(),F,8,C_AP[0]-X0-10),BLACK);
      if(it.v==='apto') cross((C_AP[0]+C_AP[1])/2,y+IH/2,INK);
      if(it.v==='no') cross((C_NO[0]+C_NO[1])/2,y+IH/2,KO);
      y+=IH;
      if(oh){
        rect(X0,y,W,oh,{color:OBSBG});
        hline(X0+8,X1,y,rgb(.85,.87,.9),.4);
        const lx=X0+10;
        text('Obs.:',lx,y+OBS_LH,FB,OBS_S,it.v==='no'?KO:INK);
        const ox=lx+FB.widthOfTextAtSize('Obs.: ',OBS_S);
        ol.forEach((l,k)=>text(l,ox,y+OBS_LH*(k+1),FI,OBS_S,INK));
        y+=oh;
      }
      // bordes de la fila (ítem + observación)
      rect(X0,y0,W,y-y0,{borderColor:LINE,borderWidth:.6});
      vline(C_AP[0],y0,y0+IH); vline(C_NO[0],y0,y0+IH);
    }
    y+=14;
  }

  // ===== Valoración final y comentarios (sección principal) =====
  const comLines=wrap(ev.comments||'',F,10.5,W-24);
  const LH=15;
  const finalMin=40+20+18*r.sections.length+10+46+30+Math.max(200,comLines.length*LH+24);
  if(y+Math.min(finalMin,BOTTOM-TOP)>BOTTOM) await newPage();
  rect(X0,y,W,24,{color:BLUE});
  text('VALORACIÓN FINAL Y COMENTARIOS GENERALES',X0+10,y+16.5,FB,12,WHITE); y+=34;
  // resumen por bloques
  const SC=[X0,X0+230,X0+310,X0+390,X1];
  rect(X0,y,W,16,{color:HEAD,borderColor:LINE,borderWidth:.6});
  ['BLOQUE','APTOS','MÍNIMO','RESULTADO'].forEach((t,i)=>text(t,SC[i]+6,y+11,FB,7.5,GREY)); y+=16;
  r.sections.forEach((sec,i)=>{const st=g.secs[i];
    rect(X0,y,W,18,{borderColor:LINE,borderWidth:.6});
    text(sec.name,SC[0]+6,y+12.5,F,9.5,BLACK);
    text(`${st.ap} / ${st.total}`,SC[1]+6,y+12.5,F,9.5,INK);
    text(`${sec.min} (${sec.pct})`,SC[2]+6,y+12.5,F,9.5,INK);
    text(st.pass?'SUPERA':'NO SUPERA',SC[3]+6,y+12.5,FB,9.5,st.pass?OK:KO);
    y+=18;});
  y+=12;
  // resultado global
  const gc=g.pass?OK:KO;
  rect(X0,y,W,40,{color:g.pass?rgb(.91,.97,.93):rgb(.99,.92,.92),borderColor:gc,borderWidth:1.4});
  text('RESULTADO GLOBAL',X0+14,y+25,FB,12,INK);
  const gt=g.pass?'SUPERA':'NO SUPERA';
  text(gt,X0+150,y+27,FB,20,gc);
  const gs=`${g.passed}/${g.n} bloques superados`;
  text(gs,X1-14-F.widthOfTextAtSize(gs,10),y+25,F,10,GREY);
  y+=56;
  // comentarios (caja grande; continúa en otra hoja si hace falta)
  text('COMENTARIOS Y OBSERVACIONES GENERALES',X0,y,FB,10,INK); y+=8;
  const sigH=0;
  let li=0;
  for(;;){
    const need=(comLines.length-li)*LH+24, avail=BOTTOM-y-sigH;
    const fits=need<=avail, boxH=fits?avail:BOTTOM-y;
    rect(X0,y,W,boxH,{borderColor:INK,borderWidth:1});
    for(let ly=y+12+LH;ly<y+boxH-6;ly+=LH) hline(X0+10,X1-10,ly+1,rgb(.88,.9,.93),.4);
    let ty=y+12+LH-3;
    while(li<comLines.length&&ty+4<=y+boxH-6){text(comLines[li],X0+12,ty,F,10.5,INK);li++;ty+=LH;}
    y+=boxH;
    if(li>=comLines.length) break;
    await newPage(); text('COMENTARIOS Y OBSERVACIONES GENERALES (cont.)',X0,y+10,FB,10,INK); y+=18;
  }
  // pie de página: aspirante + paginación
  pages.forEach((p,i)=>{
    const ft=`${r.name} - ${clean(ev.aspirant||'-')}${ev.nEval?' - '+ordinal(ev.nEval)+' evaluación':''}`;
    p.drawText(ft,{x:X0,y:PAGE_H-818,size:7.5,font:F,color:GREY});
    const pn=`${i+1} / ${pages.length}`;
    p.drawText(pn,{x:X1-F.widthOfTextAtSize(pn,8),y:PAGE_H-818,size:8,font:F,color:GREY});
  });
  doc.setTitle(`Evaluación ${r.name} - ${clean(ev.aspirant)}${ev.nEval?' ('+ordinal(ev.nEval)+')':''}`); doc.setAuthor(clean(ev.examiner)); doc.setCreator('Evaluación Árbitros FVBCV');
  return await doc.save();
}
const ordinal=n=>n?n+'ª':'';
function fileName(ev){
  const n=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'');
  return `Evaluacion_${n(ROLES[ev.role].short)}_${n(ev.aspirant)||'aspirante'}${ev.nEval?'_'+ev.nEval+'a_eval':''}_${(ev.fecha||today())}.pdf`;
}
/* Entrega del archivo: dentro de Claude usa la capacidad 'downloads'; instalada como web usa compartir/descargar del navegador */
let dlNs; const dlReady=(async()=>{try{if(window.claude&&typeof window.claude.use==='function'){dlNs=await window.claude.use('downloads');}}catch(e){dlNs=null;}return dlNs;})();
let lastPdf=null; // último PDF descargado en esta sesión: {id,file,name}
function canShareFile(f){try{return !!(f&&navigator.canShare&&navigator.share&&navigator.canShare({files:[f]}));}catch(e){return false;}}
/* 1º descargar siempre; después se ofrece compartir */
async function exportPdf(ev,fromFinal){
  if(!ev.role){toast('Falta elegir el rol');return;}
  let bytes;
  try{toast('Generando PDF…');bytes=await buildPdf(ev);}catch(e){console.error(e);toast('Error al generar el PDF');return;}
  const name=fileName(ev), blob=new Blob([bytes],{type:'application/pdf'});
  const file=(typeof File!=='undefined')?new File([blob],name,{type:'application/pdf'}):null;
  await dlReady;
  let ok=false;
  if(dlNs){
    try{await dlNs.save({filename:name,data:blob});ok=true;toast('PDF guardado');}
    catch(e){toast(e&&e.code==='declined'?'Descarga cancelada':'No se pudo guardar el PDF aquí');}
  }else{
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000); ok=true; toast('PDF descargado: '+name);
  }
  if(ok){lastPdf={id:ev.id,file,name};logPdfExport(ev);}
  if(fromFinal||(S.view==='eval'&&S.cur&&S.cur.id===ev.id)) render();
  else if(ok&&canShareFile(file)&&!dlNs) shareSheet();
}
async function sharePdf(){
  if(!lastPdf)return;
  try{await navigator.share({files:[lastPdf.file],title:lastPdf.name});}
  catch(e){if(!e||e.name!=='AbortError')toast('No se pudo abrir el menú de compartir');}
}
function shareSheet(){ // tras descargar desde el historial
  const md=document.getElementById('modal');
  md.innerHTML=`<div class="modal"><div class="sheet"><h3>PDF descargado</h3><p>${esc(lastPdf.name)}</p><div class="stack"><button class="btn pri" id="mSh">↗ Compartir (WhatsApp, correo…)</button><button class="btn sec" id="mNo">Cerrar</button></div></div></div>`;
  md.querySelector('#mSh').onclick=async()=>{await sharePdf();md.innerHTML='';};
  md.querySelector('#mNo').onclick=()=>md.innerHTML='';
}
window.__buildPdf=buildPdf; window.__cur=()=>S.cur; window.__ROLES=ROLES;
initApp();
</script>
