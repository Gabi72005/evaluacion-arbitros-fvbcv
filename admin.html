<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin · Evaluación Árbitros FVBCV</title>
<link rel="icon" href="fvbcv-logo.png" type="image/png">
<style>
/* ── Design tokens ───────────────────────────────────────── */
:root{
  --blue:#1E20E8; --blue-d:#1515C8; --blue-l:#EEF0FF;
  --ok:#166534;   --ok-l:#dcfce7;
  --ko:#b91c1c;   --ko-l:#fee2e2;
  --warn:#92400e; --warn-l:#fef3c7;
  --ink:#0f172a;  --ink2:#374151; --mute:#64748b;
  --line:#e2e8f0; --bg:#eef0f6;   --card:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}

/* ── Layout ─────────────────────────────────────────────── */
.app{max-width:900px;margin:0 auto;min-height:100vh;padding-bottom:48px}
.wrap{padding:0 18px}

/* ── Header (Gestalt: Região Comum — logo+título como unidade) */
header{
  background:var(--blue);color:#fff;
  padding:0 18px;height:56px;
  display:flex;align-items:center;gap:12px;
  margin-bottom:22px;
  box-shadow:0 2px 10px rgba(30,32,232,.28);
}
header h1{margin:0;font-size:16px;font-weight:700;flex:1;line-height:1.25}
header .sub{font-size:11px;opacity:.8;font-weight:400;display:block;margin-top:1px;letter-spacing:.01em}
.iconbtn{
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);
  color:#fff;border-radius:7px;height:32px;padding:0 11px;
  font-size:12px;font-weight:600;transition:background .15s
}
.iconbtn:hover{background:rgba(255,255,255,.26)}

/* ── Card ───────────────────────────────────────────────── */
.card{
  background:var(--card);border-radius:12px;padding:16px;
  margin-bottom:14px;border:1px solid var(--line);
  box-shadow:0 1px 3px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.03)
}

/* ── Inputs ─────────────────────────────────────────────── */
input.t{
  width:100%;border:1.5px solid var(--line);border-radius:8px;
  padding:10px 12px;background:#fff;font-size:14px;
  transition:border-color .15s
}
input.t:focus{outline:none;border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(30,32,232,.09)}

/* ── Buttons ────────────────────────────────────────────── */
.btn{
  border:0;border-radius:8px;padding:9px 15px;
  font-weight:600;font-size:13px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:filter .12s
}
.btn:active{filter:brightness(.9)}
.btn.pri{background:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-d)}
.btn.dan{background:var(--ko);color:#fff}
.btn.ok2{background:var(--ok);color:#fff}
.btn.sec{background:#fff;border:1.5px solid var(--line);color:var(--ink2)}
.btn.sec:hover{background:#f8fafc;border-color:#94a3b8}
.btn[disabled]{opacity:.4;cursor:default;pointer-events:none}

/* ── Status pills — Gestalt: Similitud (•color = estado) ── */
.pill{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:700;border-radius:6px;
  padding:3px 8px 3px 6px;white-space:nowrap
}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;flex:none}
.pill.ok{background:var(--ok-l);color:var(--ok)}.pill.ok::before{background:var(--ok)}
.pill.ko{background:var(--ko-l);color:var(--ko)}.pill.ko::before{background:var(--ko)}
.pill.na{background:#f1f5f9;color:var(--mute)}.pill.na::before{background:#94a3b8}

/* ── Stats — Gestalt: Proximidad + Continuidad (top accent) */
.stats{
  display:grid;grid-template-columns:repeat(6,1fr);
  gap:8px;margin-bottom:22px
}
.stat{
  background:var(--card);border-radius:10px;
  padding:14px 8px 12px;text-align:center;
  border:1px solid var(--line);border-top:3px solid var(--line);
  transition:box-shadow .15s
}
.stat .n{font-size:24px;font-weight:800;line-height:1;margin-bottom:5px}
.stat .l{font-size:10px;font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;color:var(--mute)}

/* ── Table — Gestalt: Figura/Fondo (cabecera diferenciada) ── */
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{
  text-align:left;padding:10px 12px;
  font-size:10px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--mute);font-weight:700;
  background:#f8fafc;
  border-bottom:1.5px solid var(--line);white-space:nowrap
}
tbody tr{transition:background .1s}
tbody tr:hover{background:#f8fafc}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}

/* Code badge — identificador único, legibilidad primero */
.code{
  font-family:ui-monospace,"SF Mono","Fira Code",Consolas,monospace;
  font-size:13px;font-weight:700;letter-spacing:.06em;
  color:var(--warn);background:var(--warn-l);
  border-radius:5px;padding:3px 7px
}
.ua{font-size:11px;color:var(--mute);margin-top:2px}
.ts{font-size:11px;color:var(--mute)}
.empty{color:var(--mute);font-size:14px;text-align:center;padding:32px 20px;line-height:1.6}

/* ── Tabs ───────────────────────────────────────────────── */
.tabs{display:flex;margin-bottom:16px;border-bottom:1.5px solid var(--line)}
.tab{
  border:0;background:transparent;padding:10px 16px;
  font-size:13px;font-weight:600;color:var(--mute);cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1.5px;
  transition:color .15s
}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.tab:hover:not(.on){color:var(--ink2)}

/* ── Modal — sheet desde abajo, región claramente separada ─ */
.modal-bg{
  position:fixed;inset:0;background:rgba(15,23,42,.52);
  z-index:20;display:flex;align-items:flex-end;justify-content:center
}
.modal-sheet{
  background:#fff;width:100%;max-width:520px;
  border-radius:16px 16px 0 0;overflow:hidden;
  box-shadow:0 -4px 28px rgba(0,0,0,.14)
}
.modal-hd{
  padding:18px 20px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:flex-start;gap:12px
}
.modal-hd .modal-ttl{flex:1}
.modal-hd h3{margin:0;font-size:17px;font-weight:700;line-height:1.3}
.modal-hd .modal-sub{font-size:13px;color:var(--mute);margin-top:3px}
.modal-bd{padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.code-box{
  background:var(--blue-l);border:1.5px solid #c7cbf8;border-radius:10px;
  padding:18px;text-align:center;margin:12px 0;
  font:800 30px/1 ui-monospace,"SF Mono",monospace;
  letter-spacing:.16em;color:var(--blue-d)
}
.hint{font-size:12px;color:var(--mute);margin-top:5px}
.stack>*+*{margin-top:8px}

/* ── Login ──────────────────────────────────────────────── */
.login-wrap{display:grid;place-items:center;min-height:100vh;padding:16px}
.login-card{
  background:var(--card);border-radius:16px;padding:28px 24px;
  width:100%;max-width:360px;
  border:1px solid var(--line);box-shadow:0 4px 24px rgba(0,0,0,.08)
}
.brand{
  display:flex;align-items:center;gap:14px;
  margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line)
}
.brand img{width:48px;height:48px;object-fit:contain;flex:none;border-radius:8px}
.brand b{display:block;font-size:17px;font-weight:700;color:var(--blue)}
.brand span{font-size:12px;color:var(--mute);display:block;margin-top:2px}
label.f{
  display:block;font-size:11px;color:var(--mute);
  margin:14px 0 5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em
}

/* ── Stat buttons (A2) ──────────────────────────────────── */
.stat-btn{cursor:pointer;text-align:center;border:0;font:inherit}
.stat-btn:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}

/* ── Actions / Toolbar ──────────────────────────────────── */
.acts{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}

/* ── Actividad: filtros + paginación ────────────────────── */
.act-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.act-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip-group{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.fchip{
  border:0;border-right:1px solid var(--line);background:#fff;
  padding:6px 12px;font-size:12px;font-weight:600;color:var(--mute);
  cursor:pointer;transition:background .12s,color .12s;white-space:nowrap
}
.fchip:last-child{border-right:0}
.fchip:hover:not(.on){background:#f8fafc;color:var(--ink2)}
.fchip.on{background:var(--blue);color:#fff}
.fchip.on-ok{background:var(--ok);color:#fff}
.fchip.on-ko{background:var(--ko);color:#fff}
.act-meta{
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;color:var(--mute);margin-bottom:8px;min-height:18px
}
.act-pager{
  display:flex;align-items:center;justify-content:center;gap:14px;
  margin-top:12px;padding:4px 0
}

/* ── Responsive breakpoint 600px ───────────────────────── */
@media(max-width:600px){
  .hide{display:none}
  .wrap{padding:0 11px}
  header{padding:0 12px;height:50px;gap:8px;margin-bottom:14px}
  header h1{font-size:14px}
  .iconbtn{height:30px;padding:0 9px;font-size:11px}
  .stats{grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
  .stat{padding:11px 6px 9px}
  .stat .n{font-size:20px}
  .stat .l{font-size:9px}
  .tabs .tab{padding:9px 11px;font-size:12px}
  .toolbar{flex-direction:column;align-items:stretch;gap:6px}
  .toolbar .t{max-width:100%!important;width:100%}
  .toolbar-btns{display:flex;gap:8px}
  .toolbar-btns .btn{flex:1;font-size:12px}
  table{font-size:12px}
  td,th{padding:9px 7px}
  .code{font-size:11px;letter-spacing:0;padding:2px 5px}
  .acts{flex-direction:column;gap:4px;align-items:stretch}
  .acts .btn{font-size:11px;padding:7px 8px}
  .acts .btn svg{margin:0 auto}
  .modal-hd{padding:14px 16px 12px}
  .modal-bd{padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px))}
}
/* ── Card layout arbitros <500px ────────────────────────── */
@media(max-width:500px){
  .arb-table thead{display:none}
  .arb-table,.arb-table tbody{display:block}
  .arb-table tbody tr{
    display:grid;grid-template-columns:1fr auto;
    grid-template-rows:auto auto auto;
    padding:13px 12px;border-bottom:1px solid var(--line)
  }
  .arb-table tbody td{border:0;padding:2px 0;display:flex;align-items:center}
  .arb-table tbody td:nth-child(1){grid-column:1;grid-row:1;font-size:14px}
  .arb-table tbody td:nth-child(2){grid-column:1;grid-row:2;margin-top:3px}
  .arb-table tbody td:nth-child(3){grid-column:1;grid-row:3;margin-top:4px}
  .arb-table tbody td.hide{display:none!important}
  .arb-table tbody td:last-child{
    grid-column:2;grid-row:1/span 3;
    flex-direction:column;justify-content:center;
    gap:5px;padding-left:12px;border:0
  }
  .arb-table tbody td:last-child .btn{padding:8px 10px;font-size:11px;white-space:nowrap}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
const WORKER_URL = 'https://eval-arbitros-fvbcv.fvbcv-eval.workers.dev';
const APP_URL    = 'https://evaluacion-arbitros-fvbcv.pages.dev'; // URL de la app del árbitro
const GUIDE_URL  = 'https://evaluacion-arbitros-fvbcv.pages.dev/guia-uso-arbitros-fvbcv.pdf';
// secret holds a session token (never the password)
let secret = sessionStorage.getItem('_adm') || '';
let tab = 'arbitros';
let feedbacks = [];
let data = null;
let statusFilter = null; // 'active' | 'pending' | 'revoked' | null
let actPage=0, actTypeFilter='all', actResultFilter='all', actSearch='';
const ACT_PAGE_SIZE=15;
try { const c = sessionStorage.getItem('_adm_cache'); if(c) data = JSON.parse(c); } catch{}

// L2: strip code field from cache to avoid storing full code list in sessionStorage
function saveCache(d){
  try{
    const stripped={...d,codes:(d.codes||[]).map(({code,...r})=>r)};
    sessionStorage.setItem('_adm_cache',JSON.stringify(stripped));
  }catch{}
}

const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fmtDate(iso){
  if(!iso) return '—';
  try{
    const d=new Date(iso);
    return d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+
           d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  }catch{return iso;}
}

function fmtRole(r){
  if(r==='primero') return '1º árb.';
  if(r==='segundo') return '2º árb.';
  if(r==='anotador') return 'Anotador';
  return esc(r||'—');
}

function parseBrowser(ua){
  if(!ua) return '—';
  if(/iPhone|iPad/.test(ua)) return 'iOS';
  if(/Android/.test(ua)) return 'Android';
  if(/Windows/.test(ua)) return 'Windows';
  if(/Mac/.test(ua)) return 'Mac';
  return 'Web';
}

function render(){
  const root=document.getElementById('root');
  if(!secret){root.innerHTML=loginHtml();bindLogin();return;}
  root.innerHTML=appHtml();
  if(data) bindApp();
}

/* ---- LOGIN ---- */
function loginHtml(){
  return `<div class="login-wrap"><div class="login-card">
    <div class="brand"><img src="fvbcv-logo.png" alt="FVBCV"><div><b>Panel Admin</b><span>Evaluación Árbitros FVBCV</span></div></div>
    <label class="f" for="sec">Contraseña</label>
    <input class="t" type="password" id="sec" placeholder="••••••••">
    <div id="lErr" style="color:var(--ko);font-size:13px;margin:6px 0 0;min-height:16px"></div>
    <button class="btn pri" id="lBtn" style="width:100%;margin-top:10px;justify-content:center">Entrar</button>
  </div></div>`;
}
function bindLogin(){
  const inp=document.getElementById('sec'),btn=document.getElementById('lBtn'),err=document.getElementById('lErr');
  inp.onkeydown=e=>{if(e.key==='Enter')btn.click();};
  btn.onclick=async()=>{
    const s=inp.value.trim();if(!s)return;
    btn.disabled=true;btn.textContent='Verificando…';err.textContent='';
    try{
      // H4: POST password to /admin/login, receive session token; never store the password
      const lr=await fetch(WORKER_URL+'/admin/login',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({password:s})
      });
      if(lr.status===429){
        err.textContent='Demasiados intentos. Espera unos minutos antes de volver a intentarlo.';
        btn.disabled=false;btn.textContent='Entrar';return;
      }
      const ld=await lr.json();
      if(!lr.ok||!ld.ok){err.textContent='Contraseña incorrecta';btn.disabled=false;btn.textContent='Entrar';return;}
      secret=ld.token;sessionStorage.setItem('_adm',ld.token);
      try{await loadData();}
      catch{err.textContent='Error al cargar datos';btn.disabled=false;btn.textContent='Entrar';}
    }catch{err.textContent='Error de conexión';btn.disabled=false;btn.textContent='Entrar';}
  };
}

/* ---- APP ---- */
function appHtml(){
  if(!data) return '<div class="wrap"><p class="empty">Cargando…</p></div>';
  const codes=data.codes||[], logs=data.logs||[];
  const active=codes.filter(c=>c.status==='active').length;
  const pending=codes.filter(c=>c.status==='pending').length;
  const revoked=codes.filter(c=>c.status==='revoked').length;
  const pdfsHoy=logs.filter(l=>l.type==='pdf'&&(l.timestamp||'').startsWith(new Date().toISOString().slice(0,10))).length;
  const fbCount=feedbacks.length;

  return `<div class="app">
  <header>
    <img src="fvbcv-logo.png" alt="FVBCV" style="height:36px;width:36px;object-fit:contain;flex:none;background:#fff;border-radius:8px;padding:3px">
    <h1>Panel Admin<span class="sub">Evaluación Árbitros FVBCV</span></h1>
    <button class="iconbtn" id="refreshBtn" title="Actualizar">↺</button>
    <a class="iconbtn" href="guia-administracion-fvbcv.pdf" download style="margin-left:4px;text-decoration:none;display:inline-flex;align-items:center;gap:5px" title="Descargar guía de administración"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Guía</a>
    <button class="iconbtn" id="logoutBtn" style="margin-left:4px">Salir</button>
  </header>
  <div class="wrap">
    <div class="stats">
      <div class="stat" style="border-top-color:var(--blue)"><div class="n" style="color:var(--blue)">${codes.length}</div><div class="l">Árbitros</div></div>
      <button class="stat stat-btn" data-filter="active" style="border-top-color:var(--ok);${statusFilter==='active'?'border:2px solid var(--ok);border-top:3px solid var(--ok)':''}"><div class="n" style="color:var(--ok)">${active}</div><div class="l">Activos</div></button>
      <button class="stat stat-btn" data-filter="pending" style="border-top-color:#d97706;${statusFilter==='pending'?'border:2px solid #d97706;border-top:3px solid #d97706':''}"><div class="n" style="color:#d97706">${pending}</div><div class="l">Sin activar</div></button>
      <button class="stat stat-btn" data-filter="revoked" style="border-top-color:var(--ko);${statusFilter==='revoked'?'border:2px solid var(--ko);border-top:3px solid var(--ko)':''}"><div class="n" style="color:var(--ko)">${revoked}</div><div class="l">Revocados</div></button>
      <button class="stat stat-btn" data-goto-tab="actividad" style="border-top-color:#64748b"><div class="n" style="color:#64748b">${pdfsHoy}</div><div class="l">PDFs hoy</div></button>
      <button class="stat stat-btn" data-goto-tab="feedback" style="border-top-color:var(--blue)"><div class="n" style="color:var(--blue)">${fbCount}</div><div class="l">Feedback</div></button>
    </div>
    <div class="tabs">
      <button class="tab ${tab==='arbitros'?'on':''}" data-tab="arbitros">Árbitros</button>
      <button class="tab ${tab==='actividad'?'on':''}" data-tab="actividad">Actividad</button>
      <button class="tab ${tab==='feedback'?'on':''}" data-tab="feedback">Feedback${fbCount?` <span style="background:var(--blue);color:#fff;border-radius:99px;padding:1px 7px;font-size:11px">${fbCount}</span>`:''}</button>
    </div>
    ${tab==='arbitros' ? tabArbitros(codes) : tab==='actividad' ? `<div id="actWrap">${tabActividad(logs)}</div>` : tabFeedback(feedbacks)}
  </div>
  <div id="modal"></div></div>`;
}

function tabArbitros(codes){
  const statusLabel={'active':'Activos','pending':'Sin activar','revoked':'Revocados'};
  let sorted=[...codes].sort((a,b)=>(a.label||'').localeCompare(b.label||'','es'));
  if(statusFilter) sorted=sorted.filter(c=>c.status===statusFilter);
  return `<div class="toolbar" style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
    <input class="t" id="arbSearch" placeholder="Buscar árbitro..." oninput="filterRows('arbSearch','arbTbody')" style="flex:1;min-width:0;max-width:320px;margin:0">
    <div class="toolbar-btns">
      <button class="btn sec" id="pdfBtn">Descargar PDF</button>
      <button class="btn pri" id="addBtn">+ Añadir árbitro</button>
    </div>
  </div>
  ${statusFilter?`<div style="font-size:13px;color:var(--mute);margin-bottom:8px">Mostrando: <b style="color:var(--ink)">${statusLabel[statusFilter]}</b> (${sorted.length}) · <a href="#" id="clearFilter" style="color:var(--blue)">Quitar filtro</a></div>`:''}
  <div class="card" style="padding:0;overflow:hidden">
  ${sorted.length?`<table class="arb-table">
    <thead><tr>
      <th>Nombre</th><th>Código</th><th>Estado</th>
      <th class="hide">Dispositivo</th><th class="hide">Último acceso</th><th></th>
    </tr></thead>
    <tbody id="arbTbody">${sorted.map(c=>`<tr>
      <td><b>${esc(c.label)}</b></td>
      <td><span class="code">${esc(c.code||'...')}</span></td>
      <td>${statusPill(c.status)}</td>
      <td class="hide">${(c.lastDeviceInfo||c.deviceInfo)?`${parseBrowser((c.lastDeviceInfo||c.deviceInfo).ua)}<div class="ua">${esc((c.lastDeviceInfo||c.deviceInfo).screen||'')} · ${esc((c.lastDeviceInfo||c.deviceInfo).lang||'')}</div>`:'<span class="ts">—</span>'}</td>
      <td class="hide"><span class="ts">${(c.lastLogin||c.usedAt)?fmtDate(c.lastLogin||c.usedAt):'—'}</span></td>
      <td><div class="acts">

function tabActividad(logs){
  const sorted=[...logs].sort((a,b)=>(b.timestamp||'').localeCompare(a.timestamp||''));

  // Filtros
  let filtered=sorted;
  if(actSearch) filtered=filtered.filter(l=>(l.label||'').toLowerCase().includes(actSearch));
  if(actTypeFilter!=='all') filtered=filtered.filter(l=>l.type===actTypeFilter);
  if(actResultFilter==='supera') filtered=filtered.filter(l=>l.passed===true);
  else if(actResultFilter==='nosupera') filtered=filtered.filter(l=>l.passed===false);

  const total=filtered.length;
  const totalPages=Math.max(1,Math.ceil(total/ACT_PAGE_SIZE));
  const page=Math.min(actPage,totalPages-1);
  const slice=filtered.slice(page*ACT_PAGE_SIZE,(page+1)*ACT_PAGE_SIZE);
  const hasPassed=logs.some(l=>l.type==='pdf'&&l.passed!=null);

  const chip=(id,label,active,extraCls='')=>
    `<button class="fchip${active?' on'+extraCls:''}" data-actfilter="${id}">${label}</button>`;

  const isFiltered=actSearch||actTypeFilter!=='all'||actResultFilter!=='all';

  return `
  <div class="act-toolbar">
    <input class="t" id="actSearch" placeholder="Buscar árbitro..." value="${esc(actSearch)}" style="flex:1;min-width:140px;max-width:280px;margin:0">
    <div class="act-chips">
      <span class="chip-group">
        ${chip('type:all','Todo',actTypeFilter==='all')}
        ${chip('type:pdf','PDF',actTypeFilter==='pdf')}
        ${chip('type:login','Login',actTypeFilter==='login')}
      </span>
      ${hasPassed?`<span class="chip-group">
        ${chip('res:all','Todos',actResultFilter==='all')}
        ${chip('res:supera','Supera',actResultFilter==='supera',' on-ok')}
        ${chip('res:nosupera','No supera',actResultFilter==='nosupera',' on-ko')}
      </span>`:''}
    </div>
  </div>
  <div class="act-meta">
    <span>${total} resultado${total!==1?'s':''}${isFiltered?' <a href="#" id="actClear" style="color:var(--blue);margin-left:6px">Quitar filtros</a>':''}</span>
    ${totalPages>1?`<span>Página ${page+1} de ${totalPages}</span>`:''}
  </div>
  <div class="card" style="padding:0;overflow:hidden">
  ${slice.length?`<table>
    <thead><tr><th>Tipo</th><th>Árbitro</th><th class="hide">Detalles</th><th>Fecha</th><th style="width:36px"></th></tr></thead>
    <tbody>${slice.map(l=>`<tr>
      <td>${l.type==='pdf'?'<span class="pill ok">PDF</span>':'<span class="pill na">Login</span>'}</td>
      <td><b>${esc(l.label||'—')}</b>${l.type==='pdf'?`<div class="ts" style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:2px">${esc(l.aspirant||'')} · ${fmtRole(l.role)}${l.nEval?' · Eval. '+esc(String(l.nEval))+'ª':''}${l.passed===true?'<span class="pill ok" style="font-size:10px;padding:2px 6px 2px 5px">Supera</span>':l.passed===false?'<span class="pill ko" style="font-size:10px;padding:2px 6px 2px 5px">No supera</span>':''}</div>`:''}
          ${l.type==='login'&&l.deviceInfo?`<div class="ts">${parseBrowser(l.deviceInfo.ua)}</div>`:''}</td>
      <td class="hide">${l.type==='pdf'?`<span class="ts">Examinador: ${esc(l.examiner||'—')}</span>`:''}
          ${l.type==='login'?`<div class="ts">${[l.city,l.country].filter(Boolean).join(', ')||'—'}${l.deviceInfo?` · ${esc(l.deviceInfo.tz||'')}`:''}</div>`:''}</td>
      <td><span class="ts">${fmtDate(l.timestamp)}</span></td>
      <td style="text-align:center">${l._key?`<button onclick="logDelete('${esc(l._key)}')" class="iconbtn" title="Eliminar registro" style="color:var(--ko);opacity:.7;font-size:15px;padding:4px 6px">🗑</button>`:''}</td>
    </tr>`).join('')}</tbody>
  </table>`:`<div class="empty">${isFiltered?'Sin resultados para este filtro.':'Sin actividad todavía.'}</div>`}
  </div>
  ${totalPages>1?`<div class="act-pager">
    <button class="btn sec act-prev"${page===0?' disabled':''} style="padding:7px 14px">← Anterior</button>
    <span class="ts">${page+1} / ${totalPages}</span>
    <button class="btn sec act-next"${page>=totalPages-1?' disabled':''} style="padding:7px 14px">Siguiente →</button>
  </div>`:''}`;
}

function renderActTab(){
  const wrap=document.getElementById('actWrap');
  if(!wrap||!data) return;
  wrap.innerHTML=tabActividad(data.logs||[]);
  bindActTab();
}

function bindActTab(){
  const inp=document.getElementById('actSearch');
  if(inp) inp.oninput=()=>{actSearch=inp.value.toLowerCase().trim();actPage=0;renderActTab();};
  document.getElementById('actClear')?.addEventListener('click',e=>{e.preventDefault();actSearch='';actTypeFilter='all';actResultFilter='all';actPage=0;renderActTab();});
  document.querySelectorAll('[data-actfilter]').forEach(b=>b.onclick=()=>{
    const f=b.dataset.actfilter;
    if(f.startsWith('type:')) actTypeFilter=f.slice(5);
    else if(f.startsWith('res:')) actResultFilter=f.slice(4);
    actPage=0;renderActTab();
  });
  document.querySelector('.act-prev')?.addEventListener('click',()=>{actPage--;renderActTab();});
  document.querySelector('.act-next')?.addEventListener('click',()=>{actPage++;renderActTab();});
}

function showAddModal(){
  const md=document.getElementById('modal');
  md.innerHTML=`<div class="modal-bg" id="mbg"><div class="modal-sheet">
    <div class="modal-hd">
      <div class="modal-ttl">
        <h3>Añadir árbitro</h3>
        <div class="modal-sub">El código se genera a partir del nombre y siempre es el mismo.</div>
      </div>
    </div>
    <div class="modal-bd">
      <label class="f" for="mname">Nombre completo</label>
      <input class="t" id="mname" placeholder="Nombre y apellidos" autocomplete="off">
      <div id="mErr" style="color:var(--ko);font-size:13px;margin:6px 0;min-height:16px"></div>
      <div id="mResult"></div>
      <div class="stack" style="margin-top:14px">
        <button class="btn pri" id="mAdd" style="justify-content:center">Generar código</button>
        <button class="btn sec" id="mClose" style="justify-content:center">Cancelar</button>
      </div>
    </div>
  </div></div>`;

  const close=()=>md.innerHTML='';
  md.querySelector('#mClose').onclick=close;
  md.querySelector('#mbg').onclick=e=>{if(e.target===md.querySelector('#mbg'))close();};
  document.getElementById('mname').onkeydown=e=>{if(e.key==='Enter')document.getElementById('mAdd').click();};
  document.getElementById('mname').focus();

  document.getElementById('mAdd').onclick=async()=>{
    const name=document.getElementById('mname').value.trim();
    const err=document.getElementById('mErr');
    if(!name){err.textContent='Escribe el nombre.';return;}
    // A3: check for similar names before calling the API
    const normN=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
    const norm=normN(name);
    const similar=(data.codes||[]).filter(c=>{
      const cn=normN(c.label); if(!cn||c.status==='revoked') return false;
      if(cn===norm&&c.label.trim()!==name) return true;
      if(cn.includes(norm)||norm.includes(cn)) return true;
      const wp=norm.split(' '),wc=cn.split(' ');
      return wp.length>=2&&wc.length>=2&&wp[0]===wc[0]&&wp[1]===wc[1];
    });
    if(similar.length){
      const res=document.getElementById('mResult');
      res.innerHTML=`<div style="background:var(--warn-l);border:1px solid #f59e0b;border-radius:8px;padding:12px;font-size:13px">
        <b>Ya existe un árbitro parecido:</b><br>${similar.map(c=>`<span style="color:var(--ink)">${esc(c.label)}</span> <span class="code" style="font-size:11px">${esc(c.code||'...')}</span> ${statusPill(c.status)}`).join('<br>')}
        <br><span style="color:var(--mute)">¿Es la misma persona?</span>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn sec" id="mSamePerson" style="flex:1;font-size:12px">Es la misma persona</button>
        <button class="btn pri" id="mDiffPerson" style="flex:1;font-size:12px">Es otra persona, generar código</button>
      </div>`;
      document.getElementById('mSamePerson').onclick=()=>{md.innerHTML='';};
      document.getElementById('mDiffPerson').onclick=()=>{res.innerHTML='';proceedAdd(name);};
      return;
    }
    proceedAdd(name);
  };
  async function proceedAdd(name){
    const err=document.getElementById('mErr');
    const btn=document.getElementById('mAdd');
    btn.disabled=true;btn.textContent='Generando…';
    try{
      const r=await fetch(WORKER_URL+'/admin/names',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+secret},
        body:JSON.stringify({name})
      });
      const d=await r.json();
      if(d.ok){
        const extra=d.alreadyExists?'<div class="hint" style="text-align:center;margin-top:4px">Ya existía en la lista. Este es su código.</div>'
                   :d.reactivated?'<div class="hint" style="text-align:center;margin-top:4px">Código reactivado.</div>':'';
        document.getElementById('mResult').innerHTML=`
          <div class="code-box">${esc(d.code)}</div>
          <p style="font-size:14px;text-align:center;margin:0">Envía este código a <b>${esc(name)}</b>.</p>
          ${extra}`;
        btn.classList.add('hidden');
        // Update list and close modal when user clicks Cerrar
        document.getElementById('mClose').textContent='Cerrar';
        document.getElementById('mClose').onclick=()=>{
          if(!d.alreadyExists && !d.reactivated){
            if(!data.codes) data.codes=[];
            data.codes.push({label:name,status:'pending',code:d.code,codeHash:d.codeHash,deviceId:null,usedAt:null,createdAt:new Date().toISOString()});
          }
          md.innerHTML='';
          render();
        };
      }else{
        err.textContent=d.error||'Error al generar';btn.disabled=false;btn.textContent='Generar código';
      }
    }catch{err.textContent='Error de conexión';btn.disabled=false;btn.textContent='Generar código';}
  };
}

function showConfirmModal({title,sub,okLabel,okClass,loadingLabel,onOk}){
  const md=document.getElementById('modal');
  md.innerHTML=`<div class="modal-bg" id="mbg"><div class="modal-sheet">
    <div class="modal-hd">
      <div class="modal-ttl">
        <h3>${esc(title)}</h3>
        ${sub?`<div class="modal-sub">${sub}</div>`:''}
      </div>
    </div>
    <div class="modal-bd">
      <div id="cmErr" style="color:var(--ko);font-size:13px;margin-bottom:8px;min-height:0"></div>
      <div class="stack">
        <button class="btn ${esc(okClass||'dan')}" id="mOk" style="justify-content:center">${esc(okLabel)}</button>
        <button class="btn sec" id="mNo" style="justify-content:center">Cancelar</button>
      </div>
    </div>
  </div></div>`;
  const close=()=>md.innerHTML='';
  md.querySelector('#mNo').onclick=close;
  md.querySelector('#mbg').onclick=e=>{if(e.target===md.querySelector('#mbg'))close();};
  document.getElementById('mOk').onclick=async()=>{
    const btn=document.getElementById('mOk');btn.disabled=true;btn.textContent=loadingLabel||'Espera…';

      const err=await onOk();
      if(err){document.getElementById('cmErr').textContent=err;btn.disabled=false;btn.textContent=okLabel;}
      else{close();}
    }catch{document.getElementById('cmErr').textContent='Error de conexión';btn.disabled=false;btn.textContent=okLabel;}
  };
}

function showRevokeModal(codeHash,label){
  showConfirmModal({
    title:'Revocar acceso',
    sub:`¿Revocar a <strong>${esc(label)}</strong>? No podrá entrar. Puedes reactivarlo después.`,
    okLabel:'Revocar acceso',okClass:'dan',loadingLabel:'Revocando…',
    onOk:async()=>{
      const r=await fetch(WORKER_URL+'/admin/revoke',{
        method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+secret},
        body:JSON.stringify({codeHash})
      });
      if((await r.json()).ok){await loadData();return null;}
      return 'No se pudo revocar. Inténtalo de nuevo.';
    }
  });
}

function showReactivateModal(codeHash,label){
  showConfirmModal({
    title:'Reactivar acceso',
    sub:`¿Reactivar a <strong>${esc(label)}</strong>? Se le asignará el mismo código que tenía.`,
    okLabel:'Reactivar acceso',okClass:'ok2',loadingLabel:'Reactivando…',
    onOk:async()=>{
      const r=await fetch(WORKER_URL+'/admin/reactivate',{
        method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+secret},

function showDeleteModal(codeHash,label){
  showConfirmModal({
    title:'Eliminar árbitro',
    sub:`¿Eliminar a <strong>${esc(label)}</strong> permanentemente?<br><strong>Esta acción no se puede deshacer.</strong>`,
    okLabel:'Eliminar',okClass:'dan',loadingLabel:'Eliminando…',
    onOk:async()=>{
      const r=await fetch(WORKER_URL+'/admin/delete',{
        method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+secret},
        body:JSON.stringify({codeHash})
      });
      if((await r.json()).ok){data.codes=data.codes.filter(c=>c.codeHash!==codeHash);saveCache(data);render();return null;}
      return 'No se pudo eliminar. Inténtalo de nuevo.';
    }
  });
}

async function loadData(){
  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),8000);
    const headers={'Authorization':'Bearer '+secret};
    const [r,rf]=await Promise.all([
      fetch(WORKER_URL+'/admin/data',    {headers,signal:ctrl.signal}),
      fetch(WORKER_URL+'/admin/feedback',{headers,signal:ctrl.signal}),
    ]);
    clearTimeout(tid);
    if(r.status===401||r.status===403){
      sessionStorage.removeItem('_adm');sessionStorage.removeItem('_adm_cache');secret='';data=null;render();return;
    }
    if(r.ok){data=await r.json();saveCache(data);}
    if(rf.ok){const fd=await rf.json();feedbacks=fd.feedbacks||[];}
    render();
  }catch(e){
    if(e&&e.name==='AbortError'&&data){render();}
    else console.error(e);
  }
}

function loadScript(src,integrity){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=src;
    if(integrity){s.integrity=integrity;s.crossOrigin='anonymous';}
    s.onload=res;s.onerror=rej;
    document.head.appendChild(s);
  });
}

async function downloadCodespdf(codes){
  const btn=document.getElementById('pdfBtn');
  if(btn){btn.disabled=true;btn.textContent='Generando…';}
  try{
    if(!window.jspdf){
      // M3: SRI hashes protect against CDN compromise. Compute with:
      // curl -s <url> | openssl dgst -sha384 -binary | openssl base64 -A
      await loadScript(
        'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
        'sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk'
      );
      await loadScript(
        'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js',
        'sha384-fCAW/rDWORTbQXSiB7mOg0QtQ5c+r0f544y6XoKjuVva0nMBlCpNUjiFeG5iMdS3'
      );
    }
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF();
    const date=new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});
    const sorted=[...codes].filter(c=>c.status!=='revoked').sort((a,b)=>(a.label||'').localeCompare(b.label||'','es'));

    // Cabecera
    doc.setFontSize(18);doc.setTextColor(30,32,232);
    doc.text('Árbitros FVBCV — Códigos de acceso',14,18);
    doc.setFontSize(10);doc.setTextColor(93,107,122);
    doc.text(`Generado el ${date}  ·  ${sorted.length} árbitros  ·  Confidencial`,14,26);

    doc.autoTable({
      startY:32,
      head:[['Nombre','Código','Estado']],
      body:sorted.map(c=>[c.label||'',c.code||'—',c.status==='active'?'Activo':'Sin activar']),
      headStyles:{fillColor:[30,32,232],textColor:255,fontStyle:'bold',fontSize:11},
      bodyStyles:{textColor:[22,32,44],fontSize:11,cellPadding:6},
      columnStyles:{1:{fontStyle:'bold',textColor:[122,56,0],cellWidth:48}},
      alternateRowStyles:{fillColor:[248,249,250]},
      didParseCell(d){if(d.section==='body'&&d.column.index===2){d.cell.styles.textColor=d.cell.raw==='Activo'?[23,132,74]:[150,150,150];}},
    });

    doc.save(`arbitros-fvbcv-${date.replace(/\//g,'-')}.pdf`);
  }finally{
    if(btn){btn.disabled=false;btn.textContent='Descargar PDF';}
  }
}
